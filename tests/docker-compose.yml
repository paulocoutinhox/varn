# backend services for the standalone database and server integration tests
# bring the services up with docker compose -f tests/docker-compose.yml up -d
# run the tests with python3 varn.py test-db
name: varn-test-backends

services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30

  mysql:
    image: mysql:8
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: varnpass
      MYSQL_DATABASE: varntest
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-pvarnpass"]
      interval: 3s
      timeout: 5s
      retries: 40

  postgres:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_PASSWORD: varnpass
      POSTGRES_USER: varn
      POSTGRES_DB: varntest
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U varn -d varntest"]
      interval: 2s
      timeout: 3s
      retries: 30
